<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tutorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Top Highlight -->
    <linearGradient id="rimShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#tutorGrad)" />
  <rect x="4" y="4" width="92" height="92" rx="26" stroke="url(#rimShine)" stroke-width="1.5" />

  <!-- Tutor Graduation Cap (Mortarboard & Tassel) -->
  <g>
    <!-- Cap Diamond (Mortarboard top) -->
    <path
      d="M50 24 L84 39.5 L50 55 L16 39.5 Z"
      fill="#FFFFFF"
    />

    <!-- Cap Under-Shadow for 3D depth -->
    <path
      d="M50 55 L84 39.5 L84 43 L50 58.5 L16 43 L16 39.5 Z"
      fill="#C7D2FE"
      opacity="0.6"
    />

    <!-- Skullcap Base (Headband) -->
    <path
      d="M30 47 V58 C30 67, 50 74, 70 58 V47 C64 53, 56 56, 50 56 C44 56, 36 53, 30 47 Z"
      fill="#F8FAFC"
    />

    <!-- Center Button -->
    <ellipse cx="50" cy="39.5" rx="3.5" ry="2" fill="#818CF8" />

    <!-- Tassel Ribbon & Ring -->
    <path
      d="M50 39.5 C68 40, 84 44, 84 48 V65"
      stroke="#38BDF8"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Tassel Brush / Fringe -->
    <path
      d="M81 65 H87 L88 75 C88 76, 80 76, 80 75 Z"
      fill="#38BDF8"
    />
  </g>
</svg>
