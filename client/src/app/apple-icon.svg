<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.5" />
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="6" />

  <!-- Background Ambient Glow Circle -->
  <circle cx="256" cy="240" r="140" fill="url(#accentGrad)" opacity="0.25" filter="url(#starGlow)" />

  <!-- Interview Dossier / Shield / Kit Silhouette -->
  <g transform="translate(0, 10)">
    <!-- Base Kit Card/Shield Outline -->
    <path
      d="M168 152 C168 136, 180 124, 196 124 L316 124 C332 124, 344 136, 344 152 L344 290 C344 340, 256 392, 256 392 C256 392, 168 340, 168 290 Z"
      fill="rgba(15, 23, 42, 0.45)"
      stroke="url(#accentGrad)"
      stroke-width="12"
      stroke-linejoin="round"
    />

    <!-- Secondary Layer Card (depth) -->
    <path
      d="M192 144 H320"
      stroke="rgba(255, 255, 255, 0.4)"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- Main AI Star Emblem (Spark of Intelligence) -->
    <path
      d="M256 160 Q256 226, 322 226 Q256 226, 256 292 Q256 226, 190 226 Q256 226, 256 160 Z"
      fill="url(#starGrad)"
      filter="url(#starGlow)"
    />

    <!-- Small Accent Sparkle (Top Right) -->
    <path
      d="M352 148 Q352 172, 376 172 Q352 172, 352 196 Q352 172, 328 172 Q352 172, 352 148 Z"
      fill="#F8FAFC"
      opacity="0.9"
    />

    <!-- Small Accent Sparkle (Bottom Left) -->
    <path
      d="M160 300 Q160 316, 176 316 Q160 316, 160 332 Q160 316, 144 316 Q160 316, 160 300 Z"
      fill="#38BDF8"
      opacity="0.85"
    />

    <!-- Verified Check Accent (Bottom Center) -->
    <circle cx="256" cy="336" r="28" fill="#10B981" />
    <path
      d="M244 336 L253 345 L268 327"
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
